name: Deploy

# Auto-deploys the static build to AWS S3 + CloudFront after CI passes on main
# (i.e. on merge). Infra (bucket, distribution, DNS, the deploy role) is
# provisioned separately (Terraform).
#
# There are no AWS secrets: the job exchanges its GitHub OIDC token for a
# deploy role that trusts only this repository's `production` environment and
# can only sync this site's bucket and invalidate its distribution.
#
# Configure under Settings → Secrets and variables → Actions → Variables
# (the infrastructure's `github_variables` output):
#   DEPLOY_ROLE_ARN                     role assumed through OIDC
#   DEPLOY_AWS_REGION                   region of the bucket
#   DEPLOY_S3_BUCKET                    target bucket
#   DEPLOY_CLOUDFRONT_DISTRIBUTION_ID   distribution to invalidate

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write # the OIDC token exchanged for the deploy role

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    # A branch-name filter alone also matches a fork PR whose branch is main.
    # Only deploy a tested push from this repository, or a manual run on main.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sierragridteam.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.DEPLOY_AWS_REGION }}

      # Hashed, fingerprinted assets → cache forever (immutable).
      - name: Sync immutable assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.DEPLOY_S3_BUCKET }}" \
            --delete \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.txt" \
            --exclude "*.json" \
            --cache-control "public, max-age=31536000, immutable"

      # HTML + manifests → always revalidate. --delete here removes pages that
      # no longer exist (the sync above skips these file types entirely).
      - name: Sync HTML & manifests
        run: |
          aws s3 sync dist/ "s3://${{ vars.DEPLOY_S3_BUCKET }}" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --include "*.xml" \
            --include "*.txt" \
            --include "*.json" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.DEPLOY_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
