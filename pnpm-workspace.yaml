allowBuilds:
  esbuild: true
  sharp: true

# Resolve the current stable releases; the committed lockfile fixes exact versions.
minimumReleaseAge: 0

# Astro uses the stable 1.x WASM bridge, not the incompatible 2.0 beta.
overrides:
  '@emnapi/runtime': 1.11.3
  # satori pins an older vulnerable patch of fflate.
  'fflate@>=0.7.0 <0.7.5': ^0.7.5
