name: sierragridteam
runtime: docker

ports:
  www: 4321

dependencies:
  - node@26.13.0
  - bun@1.4.4
  - git
  - make
  - gh

# Playwright (make ci's a11y/smoke tests, make screenshots) needs Chromium plus the system
# libraries it links against. The slim base image has neither, and moatuser has no sudo, so
# both are baked into the image here. Keep the pinned version in step with @playwright/test
# in package.json: each Playwright release expects its own browser build.
hooks:
  post_build_root: npm install --global pnpm@12.18.0 && pnpm dlx playwright@1.65.0 install-deps chromium
  post_build: pnpm dlx playwright@1.65.0 install chromium
  # Self-heals a Playwright bump before the image is rebuilt: a no-op when the browser that
  # the repo's own Playwright expects is already present.
  pre_run: if [ -d node_modules/playwright-core ]; then pnpm exec playwright install chromium >/dev/null; fi

grants:
  - claude
  - github
  - ssh:github.com
